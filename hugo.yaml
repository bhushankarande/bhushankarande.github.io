baseURL: "https://bhushankarande.github.io/"
languageCode: "en-us"
title: "Bhushan Karande"
theme: "PaperMod"

params:
  # Do not show any sections on the home page list.
  # This keeps blog posts off the default landing page.
  mainSections: []
  # Optional: tidy breadcrumbs and reading experience defaults
  ShowBreadCrumbs: true
  ShowReadingTime: true

menu:
  main:
    - identifier: about
      name: "About"
      url: "/about/"
      weight: 10
    - identifier: blog
      name: "Blog"
      url: "/blog/"
      weight: 20
    - identifier: notes
      name: "Notes"
      url: "/notes/"
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
      
