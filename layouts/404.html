{{- $url := .Site.Params.redirectURL -}}
<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  {{- if $url }}
    <link rel="canonical" href="{{ $url | safeURL }}" />
    <meta http-equiv="refresh" content="0; url={{ $url | safeURL }}" />
    <meta name="robots" content="noindex" />
    <script data-redirect="{{ $url | safeURL }}">
      (function () {
        var url = document.currentScript && document.currentScript.getAttribute('data-redirect');
        if (url) window.location.replace(url);
      })();
    </script>
  {{- end }}
</head>
<body>
  {{- if $url -}}
  <noscript>
    <p>Redirecting to <a href="{{ $url | safeURL }}">{{ $url }}</a>…</p>
  </noscript>
  {{- else -}}
  <main style="padding:2rem; font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
    <h1>Redirect not configured</h1>
    <p>Please set <code>params.redirectURL</code> in <code>hugo.yaml</code> and rebuild.</p>
  </main>
  {{- end -}}
</body>
</html>
